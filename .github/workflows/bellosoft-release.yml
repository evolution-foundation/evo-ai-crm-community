name: Release (Bellosoft)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: bellosoft-release-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: registry.bellosoft.dev
  IMAGE_NAME: registry.bellosoft.dev/evolution-foundation/evo-ai-crm-community

jobs:
  build-and-push:
    name: Build & Push
    runs-on: [self-hosted, X64, Linux, bellosoft]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Generate version tag
        id: version
        run: |
          BUILD_DATE=$(date -u +%Y-%m-%d)
          echo "version=${BUILD_DATE}-${{ github.run_number }}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Bellosoft Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: admin
          password: ${{ secrets.ZOT_PASSWORD }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image digest
        run: |
          echo "digest: ${{ steps.build.outputs.digest }}"
